<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Colosseum - P2P Gladiator Duel</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        display: block;
      }
      #hud {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 40px;
        align-items: center;
        color: #fff;
        font-weight: 900;
        font-size: 28px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        z-index: 10;
        display: none;
      }
      .score-box {
        background: rgba(139, 69, 19, 0.85);
        border: 2px solid #ffd700;
        padding: 10px 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }
      #instructions {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 215, 0, 0.4);
        padding: 14px 28px;
        border-radius: 10px;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
        z-index: 10;
        backdrop-filter: blur(5px);
        display: none;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(20, 15, 10, 0.96);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        color: white;
        box-sizing: border-box;
        padding: 20px;
      }
      #overlay h1 {
        font-size: 44px;
        margin-bottom: 10px;
        color: #ffd700;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 3px 10px rgba(255, 215, 0, 0.4);
      }
      #overlay p {
        color: #d2b48c;
        margin-bottom: 25px;
        font-size: 16px;
      }
      .input-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .roman-input {
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #ffd700;
        background: #2c1e12;
        color: #fff;
        outline: none;
        text-align: center;
        width: 250px;
      }
      .btn-group {
        display: flex;
        gap: 20px;
      }
      .roman-btn {
        background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
        color: #2c1e12;
        border: none;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 800;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(255, 140, 0, 0.5);
        transition: all 0.2s ease;
        text-transform: uppercase;
      }
      .roman-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(255, 215, 0, 0.7);
      }
      .roman-btn.secondary {
        background: linear-gradient(135deg, #cd7f32 0%, #8b4513 100%);
        color: #fff;
        box-shadow: 0 4px 20px rgba(139, 69, 19, 0.5);
      }
      .roman-btn:disabled {
        background: #4a4a4a !important;
        color: #888888 !important;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      #lobby-container {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 450px;
      }
      #player-table {
        width: 100%;
        border-collapse: collapse;
        margin: 15px 0;
        background: rgba(44, 30, 18, 0.8);
        border: 1px solid #ffd700;
        border-radius: 8px;
        overflow: hidden;
      }
      #player-table th,
      #player-table td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        color: #ffd700;
      }
      #player-table th {
        background: #5c3a21;
      }
      #qrcode-container {
        margin: 15px 0;
        padding: 10px;
        background: white;
        border-radius: 8px;
        display: none;
      }
      #status-msg {
        margin-top: 10px;
        font-weight: bold;
        color: #ffd700;
        text-align: center;
        min-height: 24px;
      }
      #room-code-display {
        font-size: 22px;
        font-weight: 900;
        color: #ffd700;
        margin-top: 5px;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        display: none;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/trystero@0.17.0/trystero-torrent.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  </head>
  <body>
    <div id="overlay">
      <h1>Grand Colosseum</h1>
      <p>P2P Gladiator Duel</p>

      <div id="name-screen" class="input-group">
        <label for="player-name-input" style="color: #d2b48c; font-weight: 600"
          >Enter Your Gladiator Name:</label
        >
        <input
          type="text"
          id="player-name-input"
          class="roman-input"
          placeholder="Maximus"
          maxlength="15"
          value="Gladiator"
        />
        <div class="btn-group" style="margin-top: 10px">
          <button class="roman-btn" onclick="setupLobby('host')">
            Host Arena
          </button>
          <button class="roman-btn secondary" onclick="setupLobby('join')">
            Join Arena
          </button>
        </div>
      </div>

      <div id="lobby-container">
        <div id="qrcode-container">
          <canvas id="qrcode"></canvas>
        </div>
        <div id="room-code-display"></div>
        <div id="status-msg">Initializing Room...</div>

        <table id="player-table">
          <thead>
            <tr>
              <th>Gladiator Name</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="player-list-body">
            <!-- Populated dynamically -->
          </tbody>
        </table>

        <div id="action-container" style="margin-top: 15px; text-align: center">
          <span
            id="waiting-text"
            style="color: #d2b48c; font-style: italic; display: none"
            >Waiting for host to start the game...</span
          >
          <button
            id="begin-battle-btn"
            class="roman-btn"
            onclick="hostStartBattle()"
            disabled
          >
            Begin Battle
          </button>
        </div>
      </div>
    </div>

    <div id="hud">
      <div class="score-box">
        <span id="p1-name">YOU</span>: <span id="p1-score">0</span>
      </div>
      <div style="font-size: 18px; color: #ffd700">VS</div>
      <div class="score-box">
        <span id="p2-name">OPPONENT</span>: <span id="p2-score">0</span>
      </div>
    </div>

    <div id="canvas-container"></div>

    <div id="instructions">
      <b>Controls:</b> Mouse to Aim & Swing Sword. <br />
      <b>Click & Hold Left Mouse</b> to DEFEND/PARRY STANCE. Release to SLASH!
      First to 3 wins.
    </div>

    <script>
      let scene, camera, renderer, clock;
      let sendAction, getAction;
      let myName = "Gladiator",
        oppName = "Waiting for Challenger...";
      let myScore = 0,
        oppScore = 0;
      let isHost = false,
        gameState = "waiting";
      let peerConnected = false;
      let localChannel = null;

      let swordGroup, oppMesh, oppSword;
      let isDefending = false;
      let lastMousePos = { x: 0, y: 0 };
      let spectators = [],
        sparkParticles;

      const config = { appId: "grand-colosseum-gladiator-v15" };

      window.addEventListener("load", () => {
        initThreeScene();

        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get("room");
        if (roomParam) {
          isHost = false;
          document.getElementById("name-screen").style.display = "none";
          document.getElementById("lobby-container").style.display = "flex";
          document.getElementById("status-msg").innerText =
            "Connecting to Arena...";

          let entered = prompt("Enter your Gladiator Name:", "Spartacus");
          if (entered) myName = entered;
          document.getElementById("p1-name").innerText = myName.toUpperCase();

          document.getElementById("begin-battle-btn").style.display = "none";
          document.getElementById("waiting-text").style.display = "inline";

          renderTable();
          startConnection(roomParam);
        }
      });

      window.setupLobby = function (mode) {
        const nameInput = document
          .getElementById("player-name-input")
          .value.trim();
        if (nameInput) myName = nameInput;
        document.getElementById("p1-name").innerText = myName.toUpperCase();

        document.getElementById("name-screen").style.display = "none";
        document.getElementById("lobby-container").style.display = "flex";

        if (mode === "host") {
          isHost = true;
          const roomCode = Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();

          const joinUrl =
            window.location.origin +
            window.location.pathname +
            `?room=${roomCode}`;
          new QRious({
            element: document.getElementById("qrcode"),
            value: joinUrl,
            size: 140,
          });
          document.getElementById("qrcode-container").style.display = "block";

          // Set room code explicitly in its own element so it ALWAYS shows
          const codeDisplay = document.getElementById("room-code-display");
          codeDisplay.style.display = "block";
          codeDisplay.innerText = `ROOM CODE: ${roomCode}`;

          document.getElementById("status-msg").innerText =
            "Waiting for challenger to connect...";

          document.getElementById("begin-battle-btn").style.display =
            "inline-block";
          document.getElementById("begin-battle-btn").disabled = true;
          document.getElementById("waiting-text").style.display = "none";

          renderTable();
          startConnection(roomCode);
        } else {
          isHost = false;
          const roomCode = prompt("Enter the Room Code:", "");
          if (!roomCode) {
            location.reload();
            return;
          }

          const codeDisplay = document.getElementById("room-code-display");
          codeDisplay.style.display = "block";
          codeDisplay.innerText = `ROOM CODE: ${roomCode.toUpperCase()}`;

          document.getElementById("status-msg").innerText =
            "Connecting to Arena...";

          document.getElementById("begin-battle-btn").style.display = "none";
          document.getElementById("waiting-text").style.display = "inline";

          renderTable();
          startConnection(roomCode.toUpperCase());
        }
      };

      window.hostStartBattle = function () {
        if (!peerConnected) return;
        broadcastData({ type: "start-battle" });
        beginBattle();
      };

      function broadcastData(data) {
        if (sendAction) sendAction(data);
        if (localChannel) localChannel.postMessage(data);
      }

      function renderTable() {
        const tbody = document.getElementById("player-list-body");
        tbody.innerHTML = `
                <tr><td>${myName}</td><td>${isHost ? "Host (Ready)" : "Challenger (Ready)"}</td></tr>
                <tr><td>${peerConnected ? oppName : "<em>Waiting for opponent...</em>"}</td><td>${peerConnected ? "Ready" : "Connecting"}</td></tr>
            `;

        if (isHost) {
          const btn = document.getElementById("begin-battle-btn");
          if (peerConnected) {
            btn.disabled = false;
            document.getElementById("status-msg").innerText =
              `${oppName} connected! Ready for battle.`;
          } else {
            btn.disabled = true;
          }
        }
      }

      function startConnection(roomCode) {
        // Local Browser BroadcastChannel as immediate fallback for same-device/same-network testing
        try {
          localChannel = new BroadcastChannel(`colosseum-${roomCode}`);
          localChannel.onmessage = (e) => handleIncomingData(e.data);
        } catch (err) {
          console.log("BroadcastChannel unavailable");
        }

        // Trystero P2P signaling
        try {
          if (typeof joinRoom === "function") {
            const trysteroRoom = joinRoom(config, roomCode);
            [sendAction, getAction] = trysteroRoom.makeAction("gameAction");

            trysteroRoom.onPeerJoin((peerId) => {
              peerConnected = true;
              renderTable();
              broadcastData({ type: "sync-name", name: myName });
            });

            trysteroRoom.onPeerLeave((peerId) => {
              peerConnected = false;
              oppName = "Waiting for Challenger...";
              document.getElementById("status-msg").innerText =
                "Opponent disconnected.";
              renderTable();
            });

            getAction((data) => handleIncomingData(data));
          }
        } catch (e) {
          console.log("Trystero initialized in fallback mode");
        }

        // Keep broadcasting identity
        setInterval(() => {
          broadcastData({ type: "sync-name", name: myName });
        }, 1000);
      }

      function handleIncomingData(data) {
        if (data.type === "sync-name") {
          if (oppName !== data.name) {
            oppName = data.name;
            peerConnected = true;
            document.getElementById("p2-name").innerText =
              oppName.toUpperCase();
            renderTable();
          }
        } else if (data.type === "start-battle") {
          beginBattle();
        } else if (data.type === "move" && oppMesh) {
          oppMesh.rotation.y = data.rotY;
          oppMesh.position.x = data.posX;
          if (oppSword) oppSword.rotation.x = data.swordX;
        } else if (data.type === "attack") {
          triggerOpponentAttack();
        }
      }

      function beginBattle() {
        gameState = "fighting";
        document.getElementById("overlay").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("overlay").style.display = "none";
          document.getElementById("hud").style.display = "flex";
          document.getElementById("instructions").style.display = "block";
        }, 500);
      }

      function initThreeScene() {
        const container = document.getElementById("canvas-container");

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.set(0, 2.2, 0);

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x87ceeb, 1);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        clock = new THREE.Clock();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
        sunLight.position.set(30, 50, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        buildClassicColosseum();
        buildPlayerAndOpponent();
        buildSparksSystem();

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mousedown", () => {
          if (gameState === "fighting") isDefending = true;
        });
        window.addEventListener("mouseup", () => {
          if (isDefending && gameState === "fighting") {
            isDefending = false;
            triggerPlayerAttack();
          }
        });

        window.addEventListener("resize", onWindowResize);
        renderer.setAnimationLoop(animate);
      }

      function buildClassicColosseum() {
        const floorGeo = new THREE.CylinderGeometry(25, 25, 1, 64);
        const floorMat = new THREE.MeshStandardMaterial({
          color: 0xd2b48c,
          roughness: 0.9,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const tierLevels = 8;
        for (let i = 0; i < tierLevels; i++) {
          const radius = 26 + i * 4;
          const height = i * 2.5;
          const tierGeo = new THREE.CylinderGeometry(
            radius,
            radius + 3.5,
            2.2,
            48,
            1,
            true,
          );
          const tierMat = new THREE.MeshStandardMaterial({
            color: 0xc2a67a,
            roughness: 0.8,
          });
          const tier = new THREE.Mesh(tierGeo, tierMat);
          tier.position.y = height - 0.5;
          scene.add(tier);

          createSpectatorCrowd(radius + 0.5, height + 1.2, 50 + i * 10);
        }
      }

      function createSpectatorCrowd(radius, yPos, count) {
        const bodyGeo = new THREE.CapsuleGeometry(0.3, 0.7, 4, 8);
        const headGeo = new THREE.SphereGeometry(0.25, 8, 8);

        for (let c = 0; c < count; c++) {
          const angle = (c / count) * Math.PI * 2 + Math.random() * 0.1;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          const spectatorGroup = new THREE.Group();
          const bodyMat = new THREE.MeshLambertMaterial({
            color: Math.random() > 0.4 ? 0xffffff : 0x990000,
          });

          const body = new THREE.Mesh(bodyGeo, bodyMat);
          body.position.y = 0.5;
          spectatorGroup.add(body);

          const head = new THREE.Mesh(
            headGeo,
            new THREE.MeshLambertMaterial({ color: 0xffd1b3 }),
          );
          head.position.y = 1.1;
          spectatorGroup.add(head);

          spectatorGroup.position.set(x, yPos, z);
          spectatorGroup.lookAt(0, yPos, 0);
          scene.add(spectatorGroup);
          spectators.push({
            group: spectatorGroup,
            speed: 2 + Math.random() * 4,
          });
        }
      }

      function buildPlayerAndOpponent() {
        swordGroup = new THREE.Group();
        const handGeo = new THREE.BoxGeometry(0.25, 0.25, 0.5);
        const armorMat = new THREE.MeshStandardMaterial({
          color: 0x8b7355,
          metalness: 0.6,
        });
        const hand = new THREE.Mesh(handGeo, armorMat);
        hand.position.set(0, -0.4, -0.6);
        swordGroup.add(hand);

        const bladeGeo = new THREE.BoxGeometry(0.12, 0.03, 2.0);
        const bladeMat = new THREE.MeshStandardMaterial({
          color: 0xe0e0e0,
          metalness: 0.95,
          roughness: 0.1,
        });
        const blade = new THREE.Mesh(bladeGeo, bladeMat);
        blade.position.set(0, -0.3, -2.0);
        swordGroup.add(blade);

        camera.add(swordGroup);
        scene.add(camera);

        const oppGroup = new THREE.Group();
        const torso = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.8, 0.6),
          new THREE.MeshStandardMaterial({ color: 0x990000 }),
        );
        torso.position.y = 0.9;
        oppGroup.add(torso);

        const oppHead = new THREE.Mesh(
          new THREE.SphereGeometry(0.35, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xffd1b3 }),
        );
        oppHead.position.y = 2.1;
        oppGroup.add(oppHead);

        const oppSwordGroup = new THREE.Group();
        const oBlade = new THREE.Mesh(bladeGeo, bladeMat);
        oBlade.position.set(0.6, 1.2, -1.0);
        oBlade.rotation.y = Math.PI;
        oppSwordGroup.add(oBlade);
        oppGroup.add(oppSwordGroup);

        oppGroup.position.set(0, 0, -12);
        scene.add(oppGroup);
        oppMesh = oppGroup;
        oppSword = oppSwordGroup;
      }

      function buildSparksSystem() {
        const geom = new THREE.BufferGeometry();
        const positions = new Float32Array(150);
        geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        sparkParticles = new THREE.Points(
          geom,
          new THREE.PointsMaterial({
            color: 0xffd700,
            size: 0.2,
            transparent: true,
            opacity: 0,
          }),
        );
        scene.add(sparkParticles);
      }

      function onMouseMove(e) {
        if (gameState !== "fighting") return;
        const movementX = e.movementX || e.clientX - lastMousePos.x;
        const movementY = e.movementY || e.clientY - lastMousePos.y;
        lastMousePos = { x: e.clientX, y: e.clientY };

        camera.rotation.y -= movementX * 0.003;
        camera.rotation.x -= movementY * 0.003;
        camera.rotation.x = Math.max(-0.5, Math.min(0.5, camera.rotation.x));

        if (swordGroup) {
          swordGroup.rotation.y = -movementX * 0.01;
          swordGroup.rotation.x = movementY * 0.01;
        }

        broadcastData({
          type: "move",
          rotY: camera.rotation.y,
          posX: 0,
          swordX: swordGroup.rotation.x,
        });
      }

      function triggerPlayerAttack() {
        let startTime = clock.getElapsedTime();
        const swingAnim = () => {
          let elapsed = clock.getElapsedTime() - startTime;
          if (elapsed < 0.25) {
            swordGroup.position.z = THREE.MathUtils.lerp(0, -0.8, elapsed * 4);
            requestAnimationFrame(swingAnim);
          } else {
            swordGroup.position.z = 0;
          }
        };
        swingAnim();

        broadcastData({ type: "attack" });

        const distance = camera.position.distanceTo(oppMesh.position);
        if (distance < 14) {
          myScore++;
          document.getElementById("p1-score").innerText = myScore;
          checkWinCondition();
        }
      }

      function triggerOpponentAttack() {
        if (isDefending) return;
        oppScore++;
        document.getElementById("p2-score").innerText = oppScore;
        checkWinCondition();
      }

      function checkWinCondition() {
        if (myScore >= 3 || oppScore >= 3) {
          alert(myScore >= 3 ? "Glory! Victory!" : "Defeat!");
          location.reload();
        }
      }

      function animate() {
        const time = clock.getElapsedTime();
        spectators.forEach((s, idx) => {
          s.group.position.y += Math.sin(time * 3 + idx) * 0.0015;
        });
        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
